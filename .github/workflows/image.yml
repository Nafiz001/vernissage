name: Image

# Builds the Go server's Docker image for amd64 and arm64 and publishes it as
# ghcr.io/nafiz001/vernissage-server, which the Oracle server pulls. The web
# app is deployed to Vercel separately. The build itself lives in
# Nafiz001/portfolio-deploy so every project builds the same way.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: Nafiz001/portfolio-deploy/.github/workflows/image.yml@main
    with:
      image: vernissage-server
      context: server
