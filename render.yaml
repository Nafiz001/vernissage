# Render blueprint for the Go server (see DEPLOY.md). The web app goes on
# Vercel, the database on Neon, and pictures through Cloudinary.
services:
  - type: web
    name: vernissage-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon's direct (unpooled) connection string
      - key: VERNISSAGE_ORIGINS
        sync: false # https://<your-app>.vercel.app
      - key: VERNISSAGE_CLOUDINARY
        sync: false # your Cloudinary cloud name
      - key: VERNISSAGE_SECRET
        generateValue: true
      - key: VERNISSAGE_SECURE_COOKIES
        value: "true"
      # Vercel and Render each add a hop to X-Forwarded-For.
      - key: VERNISSAGE_PROXY_HOPS
        value: "2"
      # 512 MB of memory: few workers, small decodes.
      - key: VERNISSAGE_WORKERS
        value: "2"
      - key: VERNISSAGE_PIXEL_BUDGET_MP
        value: "12"
      - key: VERNISSAGE_CACHE
        value: /data/cache
